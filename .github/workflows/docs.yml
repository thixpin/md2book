name: Docs

# The documentation site (VitePress, docs/): built on pull requests, which catches dead links,
# and deployed to GitHub Pages from master. Pages must use "GitHub Actions" as its source.
on:
  pull_request:
    paths: ["docs/**", "package.json", "package-lock.json", ".github/workflows/docs.yml"]
  push:
    branches: [master]
    paths: ["docs/**", "package.json", "package-lock.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
