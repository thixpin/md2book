name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # The Linux runner SC-007 refers to; also the merge gate (constitution: tests, lint, format).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
