name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # The Linux runner SC-007 refers to; also the merge gate (constitution: tests, lint, format).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The web build renders generated back covers with Chromium (spec 002).
      - run: npx playwright install --with-deps chromium
      # EPUB validation in the EPUB tests (spec 003).
      - run: sudo apt-get install -y epubcheck
      - run: npm run check

  browser:
    # Reader behaviour and the device matrix (spec 002 SC-003, SC-004).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
