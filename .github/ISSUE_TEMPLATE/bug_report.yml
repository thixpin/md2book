name: Bug report
description: Something md2book builds wrongly or a command that fails
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and the smallest book (config and Markdown) that shows the problem.
      placeholder: |
        1. book.json: ...
        2. chapters/chapter-01.md: ...
        3. md2book build pdf --config book.json
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition or command
      multiple: true
      options: [PDF, Printed PDF, EPUB, Web edition, QA report, cover, init, fonts, API]
  - type: textarea
    id: output
    attributes:
      label: Error output or screenshots
      render: shell
  - type: input
    id: version
    attributes:
      label: md2book version
      description: The output of `npm ls -g @thixpin/md2book` (or `npm ls @thixpin/md2book` in your project).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: Node 26.1, macOS 26
    validations:
      required: true
